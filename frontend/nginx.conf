# nginx del contenedor web: sirve la app de React y pasa /api a la API (servicio api, puerto 5000) por la red interna.
# El navegador solo conoce http://localhost:5173; nunca habla con la API, el agente ni Moodle por su cuenta.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: el nombre api se resuelve en cada petición, así nginx sigue funcionando si la API se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:5000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El chat espera hasta 60 s al agente antes de responder 503; nginx no debe cortar antes.
        proxy_read_timeout 90s;
    }

    # Rutas de React Router (/cursos/1/panel, /admin/estado...): siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
