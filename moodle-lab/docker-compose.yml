# Moodle de laboratorio y SQL Server de EduMonitor (TA-01.1).
# Se ejecuta desde la raíz del repositorio:
#   docker compose -f moodle-lab/docker-compose.yml --env-file .env up -d
# Los datos viven en volúmenes con nombre de Docker (no en carpetas del disco de Windows):
# sobreviven a «down» y solo se borran con «down -v».

services:
  # Base de EduMonitor (EduMonitorDB). La usa el backend; Moodle no la toca.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ hace que la contraseña se lea dentro del contenedor y no quede en la configuración de Compose.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Base propia de Moodle. Sin puerto publicado: solo la ve el contenedor de Moodle.
  moodle-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Falta MOODLE_DB_PASSWORD en .env}
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Moodle 4.5 LTS (PHP 8.3). En el primer arranque instala el sitio y crea el administrador.
  moodle:
    image: erseco/alpine-moodle:v4.5.15
    restart: unless-stopped
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:${MOODLE_PORT:-8080}
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${MOODLE_DB_PASSWORD:?Falta MOODLE_DB_PASSWORD en .env}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER:?Falta MOODLE_ADMIN_USER en .env}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Falta MOODLE_ADMIN_PASSWORD en .env}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@edumonitor.test}
      MOODLE_SITENAME: ${MOODLE_SITE_NAME:-Moodle-Lab-UTA}
    ports:
      - "${MOODLE_PORT:-8080}:8080"
    volumes:
      # Solo moodledata: el código de Moodle vive en la imagen y el estado del sitio en moodle-db.
      - moodledata:/var/www/moodledata

volumes:
  sqlserver-data:
  moodle-db-data:
  moodledata:
