# Aula virtual: Moodle de laboratorio con su base (TA-01.1, separado de EduMonitor en TA-20.3).
# Ocupa el lugar del Moodle institucional: EduMonitor (docker-compose.yml de la raíz) solo lo conoce por su URL y su token.
# Se ejecuta desde la raíz del repositorio, con el .env de la raíz:
#   docker compose -f moodle-lab/docker-compose.yml --env-file .env up -d
# Los datos viven en volúmenes con nombre de Docker: sobreviven a «down» y solo se borran con «down -v» (no usarlo).

name: aula-virtual

services:
  # Base propia de Moodle. Sin puerto publicado: solo la ve el contenedor de Moodle.
  moodle-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Falta MOODLE_DB_PASSWORD en .env}
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Moodle 4.5 LTS (PHP 8.3). En el primer arranque instala el sitio y crea el administrador.
  moodle:
    image: erseco/alpine-moodle:v4.5.15
    restart: unless-stopped
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:${MOODLE_PORT:-8080}
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: ${MOODLE_DB_PASSWORD:?Falta MOODLE_DB_PASSWORD en .env}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER:?Falta MOODLE_ADMIN_USER en .env}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Falta MOODLE_ADMIN_PASSWORD en .env}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@edumonitor.test}
      MOODLE_SITENAME: ${MOODLE_SITE_NAME:-Moodle-Lab-UTA}
    ports:
      - "${MOODLE_PORT:-8080}:8080"
    volumes:
      # Solo moodledata: el código de Moodle vive en la imagen y el estado del sitio en moodle-db.
      - moodledata:/var/www/moodledata

# Mismos volúmenes del Sprint 1 (se crearon con el proyecto edumonitor): los datos de Moodle y su token se conservan.
volumes:
  moodle-db-data:
    name: edumonitor_moodle-db-data
  moodledata:
    name: edumonitor_moodledata
